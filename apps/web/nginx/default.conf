# Pundoku web: один origin для PWA и api (PD-61).
#   /            — статика apps/web/dist + SPA-fallback на index.html
#   /api/*       — reverse proxy на контейнер api (как vite-прокси в dev), CORS не нужен
#   /health      — проксируется на api (так smoke деплоя проверяет и api, а не только nginx)
# Снаружи сюда приходит только Cloudflare Tunnel (cloudflared на хосте -> 127.0.0.1:<порт web>).

# Docker DNS. С переменной в proxy_pass nginx резолвит `api` на КАЖДЫЙ запрос (с коротким кэшем), а не
# один раз на старте: после `docker compose up -d` контейнер api получает новый IP, и без этого
# nginx слал бы запросы на старый адрес (502) до собственного рестарта. Заодно nginx стартует, даже
# если api ещё не поднят.
resolver 127.0.0.11 valid=10s ipv6=off;

# Реальный IP клиента. Cloudflare передаёт его в CF-Connecting-IP, а с хоста (cloudflared -> опубликованный
# порт Docker) запрос приходит с приватного адреса шлюза Docker. Доверяем заголовку ТОЛЬКО от приватных
# адресов: порт опубликован лишь на 127.0.0.1, так что подделать его может только процесс на самом ноуте.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header CF-Connecting-IP;

# Схема исходного запроса: X-Forwarded-Proto от Cloudflare (снаружи всегда https), иначе — схема соединения.
map $http_x_forwarded_proto $pundoku_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Большие тела не нужны: снапшот <= 1 МиБ (api режет сам, 413), запас на JSON-обёртку.
  client_max_body_size 2m;

  # ВАЖНО: security-headers.conf НЕ подключается на уровне server. Иначе он унаследовался бы в
  # проксируемые location'ы и продублировал заголовки helmet из api (два X-Frame-Options/CSP).
  # Статика подключает его явно в каждом location; ответы api несут собственные заголовки helmet.

  # --- api -----------------------------------------------------------------------------------------
  # Префикс /api сохраняется (api сам обслуживает /api/*). Без URI в proxy_pass с переменной nginx
  # передаёт исходный URI как есть, вместе с query string.
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Не дописываем к клиентскому X-Forwarded-For (его можно подделать), а ставим ровно один адрес:
    # $remote_addr после realip — реальный клиент. Тогда api с TRUST_PROXY=1 (один доверенный прыжок)
    # видит именно его в req.ip, и rate-limit считается по человеку, а не по всем сразу.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $pundoku_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    # Ответ api может ждать Sudoku.com (5 с) + генератор-фолбэк; запас.
    proxy_read_timeout 60s;
  }

  location = /health {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
  }

  # --- хешированные ассеты Vite: имя меняется вместе с содержимым -> кэш на год ----------------------
  location /assets/ {
    try_files $uri =404;
    # Без `always`: заголовок только для 2xx/3xx, иначе 404 на отсутствующий файл закэшировался бы на год.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # --- service worker и его загрузчики: браузер обязан видеть обновления сразу ---------------------
  # (workbox-<hash>.js подтягивается через importScripts из sw.js; registerSW.js без хеша в имени.)
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
  location = /registerSW.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
  location ~ ^/workbox-[0-9a-f]+\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  # --- manifest: mime application/manifest+json (в mime.types alpine-сборки расширения может не быть) ---
  location = /manifest.webmanifest {
    try_files $uri =404;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  # --- иконки и экраны запуска iOS: URL без хеша -> no-cache (ревалидация по ETag, дёшево) ----------
  # Явный no-cache важен и для Cloudflare: без Cache-Control он кэширует .png на своём edge по
  # умолчанию несколько часов, и обновлённая иконка не доезжает (урок GR-72 в SUMMON).
  location ~ ^/(icons|splash)/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  # --- всё остальное: SPA-fallback. index.html не кэшируется — он ссылается на хеш-ассеты ------------
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
}
