# Общие security-заголовки. Подключается через include в каждый location СТАТИКИ (там свой add_header, а nginx не наследует
# add_header с уровня server). В проксируемые /api и /health НЕ подключается: их заголовки ставит helmet в api.
#
# CSP осознанно НЕ ставится целиком (см. DEPLOY.md, «Заголовки безопасности»): нельзя надёжно
# проверить по коду без реального iOS Safari, что политика не сломает inline-стили React,
# Web Worker генератора, service worker и blob:/data: изображения. Только frame-ancestors —
# это единственная директива, не влияющая на загрузку ресурсов страницы.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
