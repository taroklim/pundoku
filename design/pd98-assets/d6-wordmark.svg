<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 116" width="588" height="116" role="img" aria-label="Pundoku">
  <title>Pundoku — вордмарк D6</title>
  <desc>Same drawn letters, but "Pun" is one weight heavier (stroke 26 against 22) as well as warmer in colour: written against printed, the same opposition the icon's nib stroke carries. Arc radii of the heavy u and n are compensated by one unit so cap height, x-height and baseline stay identical across the two weights. No letter modifications.</desc>
