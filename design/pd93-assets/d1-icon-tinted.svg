<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Pundoku app icon, direction 1 Aperture, tinted/mono appearance">
  <title>Pundoku — D1 «Створ» — tinted (mono mapping)</title>
  <desc>Mono mapping that iOS uses to generate the tinted and clear appearances. The real tinted icon is produced by the system from this luminance map, not shipped as a file.</desc>
  <defs>
    <linearGradient id="d1t-bg" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="0.55" stop-color="#1C1C1E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="d1t-glass" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="d1t-rim" x1="0.1" y1="0" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <mask id="d1t-mask">
      <path fill="#FFFFFF" fill-rule="evenodd" d="M357 172H667A185 185 0 0 1 852 357V667A185 185 0 0 1 667 852H357A185 185 0 0 1 172 667V357A185 185 0 0 1 357 172ZM432 336H560A96 96 0 0 1 656 432V560A96 96 0 0 1 560 656H432A96 96 0 0 1 336 560V432A96 96 0 0 1 432 336Z"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#d1t-bg)"/>
  <g mask="url(#d1t-mask)">
    <rect width="1024" height="1024" fill="url(#d1t-glass)"/>
    <path fill="none" stroke="url(#d1t-rim)" stroke-width="12" d="M357 172H667A185 185 0 0 1 852 357V667A185 185 0 0 1 667 852H357A185 185 0 0 1 172 667V357A185 185 0 0 1 357 172Z"/>
  </g>
</svg>
