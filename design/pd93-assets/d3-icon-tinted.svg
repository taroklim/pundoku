<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Pundoku app icon, direction 3 The Drop, tinted/mono appearance">
  <title>Pundoku — D3 «Капля» — tinted (mono mapping)</title>
  <desc>Mono mapping that iOS uses to generate the tinted and clear appearances. The real tinted icon is produced by the system from this luminance map, not shipped as a file. Note that D3 inverts between appearances: the light icon is dark ink on paper, so its mono map has to be re-polarised here or the glyph disappears.</desc>
  <defs>
    <linearGradient id="d3t-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="0.55" stop-color="#1C1C1E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="d3t-ink" x1="0.12" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="d3t-rim" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="d3t-mask">
      <g fill="#FFFFFF">
        <path transform="translate(512 512) scale(1.3) translate(-512 -512)" d="M786 530C784.5 462.45 678.67 372.92 608.5 335.1C538.33 297.28 423.42 270.62 365 303.1C306.58 335.58 259.67 451.48 258 530C256.33 608.52 295.08 739.13 355 774.2C414.92 809.27 545.67 781.1 617.5 740.4C689.33 699.7 787.5 597.55 786 530Z"/>
        <circle cx="650" cy="185" r="42"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#d3t-bg)"/>
  <g mask="url(#d3t-mask)">
    <rect width="1024" height="1024" fill="url(#d3t-ink)"/>
  </g>
  <g fill="none" stroke="url(#d3t-rim)" stroke-width="11">
    <path transform="translate(512 512) scale(1.3) translate(-512 -512)" d="M786 530C784.5 462.45 678.67 372.92 608.5 335.1C538.33 297.28 423.42 270.62 365 303.1C306.58 335.58 259.67 451.48 258 530C256.33 608.52 295.08 739.13 355 774.2C414.92 809.27 545.67 781.1 617.5 740.4C689.33 699.7 787.5 597.55 786 530Z"/>
  </g>
</svg>
