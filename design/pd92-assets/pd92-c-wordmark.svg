<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 112" width="472" height="112" role="img" aria-label="Pundoku">
  <title>Pundoku — вордмарк C «Литера»: Pun весом и цветом, doku вторичным</title>
  <!-- Живой текст, системные гарнитуры, ничего не встроено. Разделителя нет: иерархия
       держится только на весе и цвете — буквальное исполнение идеи «Pun весом/цветом».
       «Pun» — system-ui Bold чернилами; «doku» — ui-serif Regular вторичным тоном. -->
  <text x="36" y="76" font-size="72" letter-spacing="-1">
    <tspan font-family="system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
           font-weight="700" fill="#3B48B0">Pun</tspan><tspan dx="2"
           font-family="ui-serif, 'New York', Charter, Georgia, serif"
           font-weight="400" fill="#6E6E73">doku</tspan>
  </text>
</svg>
