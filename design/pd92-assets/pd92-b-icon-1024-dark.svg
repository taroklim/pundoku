  <rect width="1024" height="1024" fill="#1C1C1E"/>
  <rect x="220" y="220" width="584" height="584" rx="56" fill="#8C96FF"/>
  <circle cx="366" cy="660" r="60" fill="#1C1C1E"/>
</svg>
