<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Pundoku app icon B, light">
  <title>Pundoku — иконка B «Точка», светлый режим</title>
  <!-- Правила iOS: поле во весь квадрат, БЕЗ скругления в файле, без прозрачности, без текста.
       Три тона — два цвета: поле чернила, клетка бумага, точка снова чернила.
       Клетка 584/1024 = 57 % — внутри safe zone и внутри маски maskable (80 %).
       Точка в нижнем левом углу клетки = позиция точки на базовой линии (пунктуация, не радиокнопка). -->
  <rect width="1024" height="1024" fill="#3B48B0"/>
  <rect x="220" y="220" width="584" height="584" rx="56" fill="#FFFFFF"/>
  <circle cx="366" cy="660" r="60" fill="#3B48B0"/>
</svg>
