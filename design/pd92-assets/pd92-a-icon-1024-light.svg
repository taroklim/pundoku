<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Pundoku app icon A, light">
  <title>Pundoku — иконка A «Разрыв», светлый режим</title>
  <!-- Правила iOS: поле во весь квадрат, БЕЗ скругления в файле (скругляет система),
       без прозрачности, без текста.
       Сетка 588/1024 = 57 %. Размер выбран счётом, а не на глаз: при круглой маске
       `maskable` безопасный круг — 80 % канвы (радиус 409.6 от центра). Самая далёкая
       закрашенная точка угловой клетки = sqrt(2)*(512-218-18)+18 = 408.3 < 409.6.
       При сетке 624 (клетка 180) было 433.8 — угол срезало бы. -->
  <rect width="1024" height="1024" fill="#3B48B0"/>
  <g fill="#FFFFFF">
    <rect x="218" y="218" width="170" height="170" rx="18"/>
    <rect x="427" y="218" width="170" height="170" rx="18"/>
    <rect x="636" y="218" width="170" height="170" rx="18"/>
    <rect x="218" y="427" width="170" height="170" rx="18"/>
    <rect x="636" y="427" width="170" height="170" rx="18"/>
    <rect x="218" y="636" width="170" height="170" rx="18"/>
    <rect x="427" y="636" width="170" height="170" rx="18"/>
    <rect x="636" y="636" width="170" height="170" rx="18"/>
  </g>
</svg>
