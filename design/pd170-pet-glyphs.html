<title>Pundoku — Blot the pet and Glyphs (PD-170)</title>
<!--
  PD-170 — the BASE IMAGES of release 2, for the owner's approval BEFORE any code. DESIGN ONLY.
  Notes, rationale, recommendation, question for the owner: design/pd170-pet-glyphs.md.
  Shots + self-check: design/pd170-shots.mjs  (window.PD170 = { reset, apply, check, metrics }).

  1. Blot the pet — an ink blot with two eyes. Lives ONLY on the result card (Today) and on the day page of
     the Year sheet. Never on the board. Off by default (Settings → Extras). 4 moods from the plan:
     pleased / tired / surprised / asleep.  Variants:  A «Drop» (recommended) · B «Splash» · C «Dot».
     One path + eye CUT-OUTS (SVG mask): one colour, works on light/dark/forced-colors without a 2nd colour.
  2. Glyphs — nine shapes instead of 1–9.  Sets:  A «Shapes» (recommended) · B «Soft» · C «Hand-inked»
     (= A's forms with an ink edge at >= 20 pt, clean in notes).  D = today's digits, for comparison only.
     Given = SOLID (label colour), yours = OUTLINE (ink colour): the difference is the FORM, not the colour.

  Tokens: verbatim from design/pd163-modes-layout.html (= tokens.css). No new colour, no new token.
  Settings icon = GEAR_PATH from apps/web/src/shell/icons.tsx.
-->
<style>
[hidden]{ display:none !important; }
:root{
  --font-sans: system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --font-serif: ui-serif, "New York", Charter, Georgia, serif;
  --sa-top: 59px; --sa-bot: 34px;
  --bg:#F2F2F7; --elev:#FFFFFF; --chip-bg:#F2F2F7;
  --label:#1C1C1E; --label-2:#6E6E73; --label-2-grouped:#6A6A6E; --notes:#6E6E73;
  --ink:#3B48B0; --on-ink:#FFFFFF; --wax:#B3261E;
  --hairline:rgba(60,60,67,.29);
  --ink-tint:rgba(59,72,176,.12); --wax-tint:rgba(179,38,30,.10);
  --box-shadow:0 1px 2px rgba(0,0,0,.04);
  --glass-fill:rgba(255,255,255,.72); --glass-solid:#F6F6F9;
  --scrim:rgba(0,0,0,.28); --page-bg:#8A8A8E; --switch-off:#E9E9EA;
}
:root.force-dark{
  --bg:#000000; --elev:#1C1C1E; --chip-bg:#2C2C2E;
  --label:#FFFFFF; --label-2:#98989D; --label-2-grouped:#98989D; --notes:#98989D;
  --ink:#8C96FF; --on-ink:#000000; --wax:#FF6B5E;
  --hairline:rgba(235,235,245,.22);
  --ink-tint:rgba(140,150,255,.18); --wax-tint:rgba(255,107,94,.16);
  --box-shadow:none;
  --glass-fill:rgba(28,28,30,.72); --glass-solid:#141416;
  --scrim:rgba(0,0,0,.5); --page-bg:#2C2C2E; --switch-off:#39393D;
}
@media (prefers-contrast: more){ :root{ --label-2:#3C3C43; --label-2-grouped:#3C3C43; --hairline:rgba(60,60,67,.55); } }

*{ box-sizing:border-box; }
html{ font-size:17px; font-family:var(--font-sans); line-height:1.3; -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--page-bg); color:var(--label); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-appearance:none; appearance:none; text-align:left; touch-action:manipulation; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:6px; }

/* ---------- page: panel + phone frame ---------- */
.page{ display:flex; gap:28px; align-items:flex-start; justify-content:center; padding:24px 16px 80px; }
.frame{ position:relative; flex:none; width:var(--fw,390px); height:var(--fh,844px); display:flex; flex-direction:column;
  background:var(--bg); overflow:hidden; border-radius:46px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
:root.shot body{ background:var(--bg); }
:root.shot .page{ display:block; padding:0; }
:root.shot .frame{ width:100vw; height:100vh; border-radius:0; box-shadow:none; }
:root.shot .panel{ display:none; }
.panel{ width:320px; flex:none; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; background:#fff; color:#1C1C1E;
  border-radius:14px; padding:14px 14px 18px; font-size:13px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
.panel h3{ margin:0 0 2px; font-size:15px; }
.panel .hint{ margin:6px 0 0; color:#6E6E73; font-size:12px; line-height:1.35; }
.panel .grp{ margin-top:10px; }
.panel .grp > span{ display:block; font-weight:600; margin-bottom:4px; }
.panel .seg{ display:flex; flex-wrap:wrap; gap:4px; }

.panel .seg button[aria-pressed="true"]{ background:#3B48B0; color:#fff; }
.panel .seg button[aria-disabled="true"]{ opacity:.4; }

/* colour-vision simulation (review only) */
.frame.sim-gray{ filter:grayscale(1); }
.frame.sim-deut{ filter:url(#simDeut); }
.frame.sim-prot{ filter:url(#simProt); }
.frame.sim-trit{ filter:url(#simTrit); }

/* ---------- screen shell ---------- */
.screen{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
.toolbar{ flex:none; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:calc(var(--sa-top) + 8px) 16px 0; }
.title{ font-size:1.62rem; font-weight:700; letter-spacing:-.02em; line-height:1.2; margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.icon-btn{ width:44px; height:44px; flex:none; margin:0 -10px -6px 0; display:grid; place-items:center; color:var(--label-2-grouped); border-radius:22px; }

/* ---------- Year (background) + sheet ---------- */
.ymonths{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 16px 0; }
.ymonth{ padding:8px 8px 10px; border-radius:12px; background:var(--elev); box-shadow:var(--box-shadow); }
.ymonth b{ display:block; margin:0 0 6px 1px; color:var(--label-2); font-size:.6875rem; font-weight:600; }

/* ---------- settings ---------- */
.sec{ margin-top:18px; }
.sec-head{ margin:0 0 6px; padding:0 16px; font-size:.82rem; color:var(--label-2-grouped); }
.sec-foot{ margin:8px 0 0; padding:0 16px; font-size:.82rem; line-height:1.35; color:var(--label-2-grouped); }
.card{ margin:0 16px; background:var(--elev); border-radius:12px; box-shadow:var(--box-shadow); overflow:hidden; }
.row{ position:relative; width:100%; min-height:44px; display:flex; align-items:center; gap:12px; padding:11px 16px; font-size:1rem; }

.sw[aria-checked="true"]::after{ transform:translateX(20px); }

.moods{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:14px 8px 12px; }

@media (prefers-reduced-motion: reduce){ .breathe{ animation:none; } }
:root.no-motion .breathe{ animation:none; }

/* ---------- board ---------- */
.game{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.board-wrap{ flex:1 1 auto; min-height:0; container-type:size; display:grid; place-items:center; padding:10px 16px 0; }
.board{ width:min(100cqw,100cqh); height:min(100cqw,100cqh); display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.box{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hairline); border-radius:10px; overflow:hidden; box-shadow:var(--box-shadow); }

.cell.g{ color:var(--label); } .cell.p{ color:var(--ink); }

.cell .dg.p{ font-family:var(--font-sans); }

.notes > span{ display:grid; place-items:center; min-width:0; min-height:0; }
.notes .gl{ width:80%; height:80%; }
.notes .dn{ font-size:calc(min(100cqw,100cqh) / 9 * .29); font-family:var(--font-sans); }
.status{ flex:none; text-align:center; color:var(--label-2); font-size:.82rem; padding:6px 16px; }
.pad{ flex:none; display:grid; grid-template-columns:repeat(9,1fr); gap:4px; padding:0 12px; container-type:inline-size; }
.pad button{ height:48px; border-radius:10px; background:var(--elev); color:var(--ink); box-shadow:var(--box-shadow); display:grid; place-items:center; font-size:min(1.24rem,7.5cqi); }
.pad .gl{ width:min(24px, 62%); height:min(24px, 62%); }
.acts{ flex:none; display:flex; justify-content:space-around; padding:8px 12px 10px; }
.acts button{ min-width:46px; min-height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--label-2); font-size:.72rem; }
.acts svg{ width:22px; height:22px; }

/* glyph rendering */
.gl{ display:block; overflow:visible; forced-color-adjust:none; }
.gl .f{ fill:currentColor; }
.gl .o{ fill:none; stroke:currentColor; stroke-width:1.9; stroke-linejoin:round; stroke-linecap:round; }

  .pet-svg, .gl, .pet-slot, .cell, .pad button, .notes, .moods figure{ color:CanvasText !important; }

}

/* ---------- tab bar ---------- */
.tabbar{ flex:none; display:grid; grid-template-columns:repeat(3,1fr); background:var(--glass-solid); border-top:.5px solid var(--hairline); padding:7px 0 calc(2px + var(--sa-bot)); }

.fc-row{ display:flex; gap:8px; margin:0 16px; }

.fc-box.wb{ background:#fff; color:#000; } .fc-box.bw{ background:#000; color:#fff; }
.fc-box .pet-svg{ color:inherit; }
.fc-box .pet-svg .ink{ fill:currentColor; }
.gtable{ margin:0 16px; background:var(--elev); border-radius:12px; padding:4px 10px; box-shadow:var(--box-shadow); }
.gtable .gr{ display:grid; grid-template-columns:40px 40px 40px 34px 1fr; align-items:center; gap:8px; min-height:48px; }
.gtable .gr + .gr{ border-top:.5px solid var(--hairline); }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Set C: ink edge. Primitive units = the glyph's own 24-unit box, so the wobble scales with the glyph. -->
    <filter id="pdInk" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- colour-vision simulation, Machado et al. 2009, severity 1.0 (review only) -->
    <filter id="simDeut" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0"/></filter>
    <filter id="simProt" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.152 1.053 -0.205 0 0  0.115 0.786 0.099 0 0  -0.004 -0.048 1.052 0 0  0 0 0 1 0"/></filter>
    <filter id="simTrit" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="1.256 -0.077 -0.179 0 0  -0.078 0.931 0.148 0 0  0.005 0.691 0.304 0 0  0 0 0 1 0"/></filter>
  </defs>
</svg>
<div class="page">
  <aside class="panel" aria-label="Mockup controls">
    <h3>PD-170 · питомец и глифы</h3>
    <p class="hint">Макет для согласования, не код. Рамка 390×844 (iPhone 16). Заметки и рекомендация — pd170-pet-glyphs.md.</p>
    <div id="controls"></div>
  </aside>
  <div class="frame" id="frame"></div>
</div>
<script>
"use strict";
(function(){
/* ============================================================ errors → banner */
function banner(msg){
  let b = document.getElementById("pd170-err");
  if (!b){ b = document.createElement("div"); b.id = "pd170-err"; document.body.appendChild(b); }
  b.textContent += (b.textContent ? "\n" : "") + msg;
}

};
const NAME = { disc:"circle", square:"square", triangle:"triangle", diamond:"diamond", plus:"plus", dome:"dome", star:"star", leaf:"leaf", hourglass:"hourglass",
  squircle:"rounded square", rtriangle:"rounded triangle", capsule:"capsule", rdiamond:"rounded diamond", rdome:"dome", sparkle:"sparkle", quatrefoil:"clover" };
/* Digit → form. Deliberately NOT triangle=3 / square=4 / star=5: no side-count hint of the digit. */
const SETS = {
  A: { label:"A · Фигуры",      forms:["disc","triangle","square","plus","diamond","dome","star","leaf","hourglass"] },
  B: { label:"B · Мягкие",      forms:["disc","rtriangle","squircle","capsule","rdiamond","rdome","sparkle","leaf","quatrefoil"] },
  C: { label:"C · Рукописные",  forms:["disc","triangle","square","plus","diamond","dome","star","leaf","hourglass"], inked:true },
  D: { label:"D · Цифры (сейчас)", digits:true }
};
/* kind: given (solid) | placed (outline) | pad (outline) | note (solid, small). Set C inks only >= 20 pt kinds. */
function glyph(setKey, d, kind){
  const set = SETS[setKey]; const form = set.forms[d - 1];
  const ink = set.inked && kind !== "note" ? ' filter="url(#pdInk)"' : "";
  const body = (kind === "placed" || kind === "pad")
    ? `<g transform="translate(12 12) scale(.9) translate(-12 -12)"><path class="o" d="${P[form]}"${ink}/></g>`
    : `<path class="f" d="${P[form]}"${ink}/>`;
  return `<svg class="gl gl-${kind}" viewBox="0 0 24 24" aria-hidden="true" data-form="${form}">${body}</svg>`;
}

/* ============================================================ PET */
const MOOD = {
  happy:     { ry:13,   rx:15,   widen:.12, lift:0,   label:"pleased",   sub:"clean solve" },
  tired:     { ry:10.5, rx:16.5, widen:.18, lift:0,   label:"tired",     sub:"fixes or hints" },
  surprised: { ry:14.5, rx:14,   widen:.06, lift:1.6, label:"surprised", sub:"a special day" },
  asleep:    { ry:7.5,  rx:18,   widen:.15, lift:0,   label:"asleep",    sub:"not played / unfinished" }
};
const GROUND = 39;
const PV = {
  A: { label:"A · Капля", harm:[[2,.03,.4],[3,.035,1.3],[5,.015,2.1]], spikes:[], n:40, drops:"few" },
  B: { label:"B · Брызги", harm:[[2,.03,.9],[3,.03,2.2]], spikes:[[-0.35,.30],[0.55,.22],[1.25,.26],[2.05,.20],[2.75,.32],[3.6,.24],[4.5,.28],[5.35,.22]], n:96, drops:"many" },
  C: { label:"C · Точка", harm:[], spikes:[], n:32, drops:"none" }
};
function smoothClosed(pts){
  const n = pts.length, f = (v) => v.toFixed(2);
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + "z";
}
function bodyPath(pv, m){
  const v = PV[pv], cx = 24, cy = GROUND - .82 * m.ry - m.lift, pts = [];
  for (let i = 0; i < v.n; i++){
    const t = (2 * Math.PI * i) / v.n, s = Math.sin(t), c = Math.cos(t);
    let r = 1;
    for (const [k, a, ph] of v.harm) r += a * Math.cos(k * t + ph);
    for (const [ang, a] of v.spikes){
      let dt = Math.atan2(Math.sin(t - ang), Math.cos(t - ang));
      r += a * Math.exp(-(dt / .085) * (dt / .085));
    }
    pts.push([cx + m.rx * c * r * (1 + m.widen * Math.max(0, s)), cy + m.ry * s * r * (s > 0 ? .82 : 1)]);
  }
  return { d: smoothClosed(pts), cx, cy };
}
function eyes(mood, m, cx, cy){
  const ex = Math.max(4.6, m.rx * .33), ey = cy - m.ry * (mood === "asleep" ? 0 : .12);
  const L = cx - ex, R = cx + ex, k = 'fill="#000"', s = 'fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"';
  switch (mood){
    case "happy":     return `<path ${s} d="M${L-2.6} ${ey+1.2}q2.6-3.6 5.2 0M${R-2.6} ${ey+1.2}q2.6-3.6 5.2 0"/>`;
    case "tired":     return `<path ${k} d="M${L-3} ${ey}h6a3 3 0 0 1-6 0zM${R-3} ${ey}h6a3 3 0 0 1-6 0z"/>`;
    case "surprised": return `<circle ${k} cx="${L}" cy="${ey}" r="3.6"/><circle ${k} cx="${R}" cy="${ey}" r="3.6"/>`;
    default:          return `<path ${s} d="M${L-2.7} ${ey}h5.4M${R-2.7} ${ey}h5.4"/>`;
  }
}
function drops(pv, mood, m, cx, cy){
  const v = PV[pv]; if (v.drops === "none") return [];
  const top = cy - m.ry, bot = cy + .82 * m.ry;
  const few = {
    happy:     [[cx + m.rx + 4, bot - 3.5, 1.7]],
    tired:     [[cx - m.rx - 3.4, bot - 1.6, 1.5], [cx + m.rx + 3, bot - 1, 1.1]],
    surprised: [[cx + m.rx * .55, top - 4.5, 2.0], [cx - m.rx * .5, top - 3, 1.4]],
    asleep:    [[cx + m.rx + 3.4, bot - 2.4, 1.4]]
  }[mood];
  if (v.drops === "few") return few;
  return few.concat([[cx - m.rx - 3.8, cy - m.ry * .35, 1.2], [cx + m.rx * .7, top - 2.2, 1.0], [cx - m.rx * .2, bot + 3.2, .9]]);
}
let UID = 0;
function pet(pv, mood, size, extraClass){
  const m = MOOD[mood], b = bodyPath(pv, m), id = "pm" + (++UID);
  const dr = drops(pv, mood, m, b.cx, b.cy).map(([x, y, r]) => `<circle class="ink" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}"/>`).join("");
  return `<svg class="pet-svg ${extraClass || ""}" viewBox="0 0 48 48" width="${size}" height="${size}" role="img" aria-label="Blot, ${m.label}" data-mood="${mood}">` +
    `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-4" y="-4" width="56" height="56"><rect x="-4" y="-4" width="56" height="56" fill="#fff"/>${eyes(mood, m, b.cx, b.cy)}</mask></defs>` +
    `<g class="breathe ${mood}"><path class="ink" d="${b.d}" mask="url(#${id})"/>${dr}</g></svg>`;
}

function rng(seed){ let x = seed >>> 0; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ============================================================ pieces */
function tabbar(sel){
  const t = (k, l) => `<button type="button" class="tab${sel === k ? " sel" : ""}"${sel === k ? ' aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`;
  return `<nav class="tabbar" aria-label="Tabs">${t("today", "Today")}${t("play", "Play")}${t("year", "Year")}</nav>`;
}
function heat(seed){
  const r = rng(seed); let h = "";
  for (let i = 0; i < 81; i++){
    const g = GIV[i] !== "0";
    h += g ? `<i style="opacity:.06"></i>` : `<i style="opacity:${(.18 + r() * .82).toFixed(2)}"></i>`;
  }
  return `<div class="heat" role="img" aria-label="Your path">${h}</div>
    <div class="legend"><span>Early</span><span class="bar" aria-hidden="true">${[.2,.4,.6,.8,1].map((o) => `<i style="opacity:${o}"></i>`).join("")}</span><span>Late</span></div>`;
}
function rows(mood){
  const kv = (k, v, cls) => `<div class="kv"><dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${v}</dd></div>`;
  if (mood === "tired") return `<dl class="rows">${kv("Time", "18:31")}${kv("Corrections", "4", "err")}${kv("Hints", "1")}${kv("Technique reached", "Hidden single")}</dl>`;
  if (mood === "surprised") return `<dl class="rows">${kv("Time", "7:02")}${kv("Corrections", "Clean")}${kv("Technique reached", "Pairs")}${kv("Best time · Medium", "New")}</dl>`;
  return `<dl class="rows">${kv("Time", "9:48")}${kv("Corrections", "Clean")}${kv("Technique reached", "Pairs")}</dl>`;
}

/* ---------- Year: canvas behind + day page of the month sheet ---------- */
function yearCanvas(){
  const r = rng(5), names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let h = "";
  names.forEach((n, mi) => {
    let g = "";
    for (let d = 0; d < 35; d++){
      const v = mi < 8 || (mi === 8 && d < 28) ? 0 : mi === 9 && d < 6 ? 1 : 2;
      if (v === 2 || d > 30) g += `<i class="v"></i>`;
      else { const x = r(); g += x < .14 ? `<i class="m"></i>` : `<i style="opacity:${(.3 + x * .7).toFixed(2)}"></i>`; }
    }
    h += `<div class="ymonth"><b>${n}</b><div class="mg">${g}</div></div>`;
  });
  return h;
}

/* ---------- Glyph board ---------- */
function cellHTML(i){
  const set = SETS[S.gs], g = GIV[i] !== "0", p = PLAYED.includes(i), n = NOTES[i];
  const cls = ["cell", g ? "g" : p ? "p" : "", i === SEL ? "sel" : ""].filter(Boolean).join(" ");
  const d = +(g ? GIV[i] : SOL[i]);
  let inner = "", label;
  if (g || p){
    inner = set.digits ? `<span class="dg ${g ? "g" : "p"}">${d}</span>` : glyph(S.gs, d, g ? "given" : "placed");
    label = `${set.digits ? d : NAME[set.forms[d - 1]]}, ${g ? "given" : "yours"}`;
  } else if (n){
    inner = `<div class="notes">${[1,2,3,4,5,6,7,8,9].map((k) => `<span>${n.includes(k) ? (set.digits ? `<span class="dn">${k}</span>` : glyph(S.gs, k, "note")) : ""}</span>`).join("")}</div>`;
    label = `notes: ${n.map((k) => (set.digits ? k : NAME[set.forms[k - 1]])).join(", ")}`;
  } else label = "empty";
  return `<div class="${cls}" role="gridcell" aria-label="${esc(label)}">${inner}</div>`;
}
function board(){
  let h = "";
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++){
    let b = "";
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) b += cellHTML((br * 3 + r) * 9 + bc * 3 + c);
    h += `<div class="box">${b}</div>`;
  }
  const set = SETS[S.gs];
  const pad = [1,2,3,4,5,6,7,8,9].map((d) => `<button type="button" aria-label="${set.digits ? d : NAME[set.forms[d - 1]]}">${set.digits ? d : glyph(S.gs, d, "pad")}</button>`).join("");
  const chip = set.digits ? "" : `<span class="mode-chip">${ICON.glyphs}<span>Glyphs</span></span>`;
  return `<div class="screen">
    <header class="toolbar"><h1 class="title clip">Play</h1></header>
    <p class="subline clip">Medium · 04:12${chip}</p>
    <div class="game">
      <div class="board-wrap"><div class="board" role="grid" aria-label="Board" data-testid="board">${h}</div></div>
      <p class="status">${set.digits ? "Given — serif · yours — ink" : "Given — solid · yours — outline"}</p>
      <div class="pad" data-testid="pad">${pad}</div>
      <div class="acts"><button type="button">${ICON.notes}<span>Notes</span></button><button type="button">${ICON.undo}<span>Undo</span></button><button type="button">${ICON.erase}<span>Erase</span></button></div>
    </div>
    ${tabbar("play")}
  </div>`;
}

/* ---------- Glyph specimen + distinguishability check ---------- */
const RASTER = 28; // ≈ 9.3 pt note glyph at @3x
function raster(d, size){
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"); x.scale(size / 24, size / 24); x.fillStyle = "#000"; x.fill(new Path2D(d));
  const a = x.getImageData(0, 0, size, size).data, out = new Uint8Array(size * size);
  for (let i = 0; i < out.length; i++) out[i] = a[i * 4 + 3] > 127 ? 1 : 0;
  return { mask: out, canvas: c };
}
function metrics(setKey){
  const set = SETS[setKey]; if (set.digits) return null;
  const ms = set.forms.map((f) => raster(P[f], RASTER).mask);
  const area = ms.map((m) => m.reduce((s, v) => s + v, 0) / m.length);
  const pairs = [];
  for (let i = 0; i < 9; i++) for (let j = i + 1; j < 9; j++){
    let inter = 0, uni = 0;
    for (let k = 0; k < ms[i].length; k++){ inter += ms[i][k] & ms[j][k]; uni += ms[i][k] | ms[j][k]; }
    pairs.push({ a: i + 1, b: j + 1, iou: uni ? inter / uni : 0 });
  }
  pairs.sort((p, q) => q.iou - p.iou);
  const mn = Math.min(...area), mx = Math.max(...area);
  return { area, spread: mx / mn, pairs, top: pairs.slice(0, 4) };
}
function glyphSpec(){
  const set = SETS[S.gs];
  if (set.digits) return `<div class="screen"><header class="toolbar"><h1 class="title">Digits</h1></header><div class="scroll"><p class="spec-note">D — today's digits, shown on the board only for comparison. Pick A, B or C for the glyph check.</p></div></div>`;
  const m = metrics(S.gs);
  const head = `<div class="gr h"><span>given</span><span>yours</span><span>note</span><span>note px</span><span>form · weight</span></div>`;
  const rowsH = set.forms.map((f, i) => `<div class="gr"><span class="c39 g">${glyph(S.gs, i + 1, "given")}</span><span class="c39 p">${glyph(S.gs, i + 1, "placed")}</span><span class="n9 c39" style="background:none">${glyph(S.gs, i + 1, "note")}</span><canvas class="px" data-px="${f}" width="${RASTER}" height="${RASTER}"></canvas><b>${NAME[f]}<small>pad ${i + 1} · fill ${(m.area[i] * 100).toFixed(0)} %</small></b></div>`).join("");
  const pairs = m.top.map((p) => `<div class="pair">${glyph(S.gs, p.a, "given")}${glyph(S.gs, p.b, "given")}<span class="bar"><i class="${p.iou >= .85 ? "hi" : ""}" style="width:${(p.iou * 100).toFixed(0)}%"></i></span><span class="num">${p.iou.toFixed(2)}</span></div>`).join("");
  const all9 = `<div class="notes">${[1,2,3,4,5,6,7,8,9].map((k) => `<span>${glyph(S.gs, k, "note")}</span>`).join("")}</div>`;
  return `<div class="screen">
    <header class="toolbar"><h1 class="title clip">Glyphs · set ${S.gs}</h1></header>
    <p class="subline clip">${esc(set.label)} · specimen for review</p>
    <div class="scroll">
      <section class="sec"><p class="sec-head">Notes: all nine in one 39 pt cell — real size and ×3</p>
        <div class="mini-cells" data-testid="notes-cells"><div><div class="cellx">${all9}</div><span class="cap">39 pt</span></div><div><div class="cellx zoom">${all9}</div><span class="cap">×3 (vector)</span></div></div></section>
      <section class="sec"><p class="sec-head">Closest pairs at note size (overlap, ${RASTER} px ≈ 9 pt @3x)</p>
        <div class="mx" data-testid="iou">${pairs}<p>Overlap of the two silhouettes, centred in the same box: 0 = nothing in common, 1 = identical. A pessimistic proxy: it ignores corners, which the eye reads well. Red ≥ 0.85 — the pair differs only by a soft detail and is a real risk at note size. Weight spread (max ÷ min fill): <b data-testid="spread">${m.spread.toFixed(2)}</b>.</p></div></section>
      <section class="sec"><p class="sec-head">The set</p><div class="gtable" data-testid="gtable">${head}${rowsH}</div></section>
    </div>
  </div>`;
}

/* ============================================================ panel */
const CTRL = [
  ["screen", "Экран", [["today","Today · карточка"],["year","Year · день"],["settings","Настройки"],["petspec","Питомец · размеры"],["board","Поле · глифы"],["glyphspec","Глифы · проверка"]]],
  ["pv", "Питомец: вариант", [["A","A · Капля"],["B","B · Брызги"],["C","C · Точка"]]],
  ["mood", "Настроение", [["happy","доволен"],["tired","устал"],["surprised","удивлён"],["asleep","спит"]]],
  ["gs", "Глифы: набор", [["A","A · Фигуры"],["B","B · Мягкие"],["C","C · Рукописные"],["D","D · Цифры"]]],
  ["theme", "Тема", [["light","светлая"],["dark","тёмная"]]],
  ["sim", "Цветовое зрение (симуляция)", [["none","норма"],["gray","ч/б"],["deut","дейтеранопия"],["prot","протанопия"],["trit","тританопия"]]],
  ["pet", "Питомец в Настройках", [[true,"вкл"],[false,"выкл"]]]
];
function panel(){
  document.getElementById("controls").innerHTML = CTRL.map(([k, l, opts]) => `<div class="grp"><span>${l}</span><div class="seg">${opts.map(([v, t]) => {
    const dis = k === "mood" && v === "asleep" && S.screen === "today";
    return `<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k] === v)}"${dis ? ' aria-disabled="true" title="Спит — только в Year: на Today карточка есть лишь у решённой сетки"' : ""}>${t}</button>`;
  }).join("")}</div></div>`).join("") +
  `<p class="hint">«Спит» — только в Year (не играл / не закончил): на Today карточки у нерешённой сетки нет. Цветовая симуляция — фильтр Machado 2009 на всю рамку, только для ревью.</p>`;
}

/* ============================================================ render */
function render(){
  UID = 0;
  const root = document.documentElement;
  root.classList.toggle("force-dark", S.theme === "dark");
  root.classList.toggle("force-light", S.theme !== "dark");
  const frame = document.getElementById("frame");
  frame.className = "frame" + (S.sim !== "none" ? " sim-" + S.sim : "");
  frame.style.setProperty("--fw", S.w + "px");
  frame.style.setProperty("--fh", S.w === "320" ? "568px" : "844px");
  const screen = S.screen === "today" && S.mood === "asleep" ? "year" : S.screen;
  frame.innerHTML = { today, year, settings, petspec: petSpec, board, glyphspec: glyphSpec }[screen]();
  frame.querySelectorAll("canvas[data-px]").forEach((cv) => {
    const src = raster(P[cv.dataset.px], RASTER).canvas, x = cv.getContext("2d");
    const dark = S.theme === "dark";
    x.fillStyle = dark ? "#1C1C1E" : "#FFFFFF"; x.fillRect(0, 0, RASTER, RASTER);
    x.globalCompositeOperation = "source-over";
    const tmp = document.createElement("canvas"); tmp.width = tmp.height = RASTER;
    const tx = tmp.getContext("2d"); tx.drawImage(src, 0, 0); tx.globalCompositeOperation = "source-in";
    tx.fillStyle = dark ? "#98989D" : "#6E6E73"; tx.fillRect(0, 0, RASTER, RASTER);
    x.drawImage(tmp, 0, 0);
  });
  panel();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k){
    if (b.getAttribute("aria-disabled") === "true") return;
    const k = b.dataset.k; let v = b.dataset.v; if (k === "pet") v = v === "true";
    S[k] = v; render(); return;
  }
  if (b.dataset.act === "pet"){ S.pet = !S.pet; render(); return; }
  if (b.dataset.go){ S.screen = b.dataset.go; render(); }
});

/* ============================================================ self-check */
function check(){
  const out = [], frame = document.getElementById("frame"), fr = frame.getBoundingClientRect();
  // 1. horizontal overflow: anything visible poking out of the frame sideways
  frame.querySelectorAll("*").forEach((el) => {
    if (el.closest(".fc-row, defs, mask")) return;
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    if (r.right > fr.right + .5 || r.left < fr.left - .5) out.push("overflow: " + el.tagName.toLowerCase() + "." + String(el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className).split(" ")[0] + " " + Math.round(r.left) + "…" + Math.round(r.right));
  });
  frame.querySelectorAll(".scroll, .ysb").forEach((s) => { if (s.scrollWidth > s.clientWidth + 1) out.push("h-scroll in " + s.className); });
  // 2. truncated single-line text
  frame.querySelectorAll(".clip").forEach((el) => { if (el.scrollWidth > el.clientWidth + 1) out.push("clipped text: " + el.textContent.trim().slice(0, 30)); });
  // 3. every pet SVG actually renders a shape
  frame.querySelectorAll("svg.pet-svg").forEach((sv) => {
    const p = sv.querySelector("path.ink"); let bb = null;
    try { bb = p && p.getBBox(); } catch (e) {}
    if (!p || !bb || bb.width < 10 || bb.height < 4) out.push("pet not rendered: " + sv.dataset.mood);
    if (sv.getBoundingClientRect().width === 0) out.push("pet has zero size");
    if (!/^M[\d.-]/.test(p ? p.getAttribute("d") : "") || /NaN/.test(p ? p.getAttribute("d") : "NaN")) out.push("pet path invalid");
  });
  // 4. every glyph SVG renders
  frame.querySelectorAll("svg.gl").forEach((sv) => {
    const p = sv.querySelector("path"); let bb = null;
    try { bb = p && p.getBBox(); } catch (e) {}
    if (!bb || bb.width < 8 || bb.height < 8) out.push("glyph not rendered: " + sv.dataset.form);
  });
  // 5. board: 81 cells, pad targets >= 44 tall, board not tiny
  const bd = frame.querySelector("[data-testid=board]");
  if (bd){
    if (bd.querySelectorAll(".cell").length !== 81) out.push("board cells != 81");
    if (bd.getBoundingClientRect().width < 150) out.push("board < 150 px");
    frame.querySelectorAll(".pad button").forEach((b) => { const r = b.getBoundingClientRect(); if (r.height < 44 || r.width < 28) out.push("pad target " + Math.round(r.width) + "×" + Math.round(r.height)); });
    if (S.gs !== "D" && frame.querySelectorAll(".pad svg.gl").length !== 9) out.push("pad glyphs != 9");
  }
  // 6. metrics computable for all three sets
  ["A", "B", "C"].forEach((k) => { const m = metrics(k); if (!m || !isFinite(m.spread) || m.pairs.some((p) => !isFinite(p.iou))) out.push("metrics NaN for set " + k); });
  // 7. cards/sheets: the pet never sits inside the board
  if (frame.querySelector(".board .pet-svg, .pad .pet-svg")) out.push("pet on the board!");
  return [...new Set(out)].slice(0, 12);
}

window.PD170 = {
  reset(){ S = Object.assign({}, DEF); render(); },
  apply(o){ Object.assign(S, o); if (typeof S.pet === "string") S.pet = S.pet === "true"; render(); },
  check, metrics: (k) => { const m = metrics(k); return m && { spread: m.spread, top: m.top, area: m.area }; },
  state: () => Object.assign({}, S)
};

if (new URLSearchParams(location.search).get("shot") === "1") document.documentElement.classList.add("shot");
render();
})();
