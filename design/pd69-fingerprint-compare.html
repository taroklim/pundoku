<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pundoku — стили PNG-отпечатка</title>
<style>
body{font:16px -apple-system,system-ui,sans-serif;margin:24px;background:#f2f2f7;color:#111}

.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}

<h1>Три стиля PNG-отпечатка (без цифр решения)</h1>

<div class="row">
<figure><img src="pd69-shots/wk-b4-fp-rhythm-light.png" alt=""><figcaption>Rhythm<p>порядок и темп заполнения клеток (рекомендация дизайнера)</p></figcaption></figure>
<figure><img src="pd69-shots/wk-b4-fp-path-light.png" alt=""><figcaption>Path<p>линия, по которой вы двигались по полю</p></figcaption></figure>
<figure><img src="pd69-shots/wk-b4-fp-trace-light.png" alt=""><figcaption>Trace<p>тепловая карта времени на клетку</p></figcaption></figure>

<h2>Тёмная тема (Path в тёмной не снимался)</h2>
